# Lint, tests, type check and build for frontend and backend. Runs on every push to main and on every
# pull request (Dependabot's too), and before every release (build-images.yml calls it), so a broken
# state never becomes an image.
name: Checks

on:
  push:
    branches: [main, next]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when build-images.yml calls this, so the release's checks never
  # cancel (or get cancelled by) the normal checks of the same push.
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.part }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [frontend, backend]
    defaults:
      run:
        working-directory: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v7

      # Node 22 with npm 10, the same as the image (node:22-alpine); the lockfiles are written by npm 10.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.part }}/package-lock.json

      - run: npm ci
      - run: npm run lint:check
      - run: npm test
      # The frontend build includes the type check (vue-tsc).
      - run: npm run build

  preview-config:
    name: Preview config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The Preview app may differ from the normal one only in name, version, slug, texts and image.
      - run: node scripts/check-preview-config.mjs

  core-copies:
    name: Core copies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # frontend/src/core/ and backend/src/core/ are copies of core/ (shared code such as the check of
      # an imported theme). The frontend and backend jobs test and build the copies; this step makes
      # sure both copies are the same as core/, so the browser and the backend check alike.
      - run: node scripts/check-core-copies.mjs
